[package]
name = "drone-id"
description = "ASTM F3411 22a implementation for Drone ID"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
keywords = ["drone", "drone-id", "fpv"]
categories = ["aerospace::drones"]

[features]
# Spoof/trust verdicts for received frames, via the `remoteid` crate.
trust = ["dep:remoteid"]

[dependencies]
remoteid = { version = "0.3.3", optional = true, default-features = false }
